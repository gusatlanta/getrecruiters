<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GetRecruiters Salary Guide Ad</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@500&family=Quicksand:wght@700&display=swap">
<style>
/* 1200 x 627 single image ad. Offer on solid orange, tilted guide cover on the right.
   Kit rules: orange is never a gradient, white on orange is for big headlines only, smaller words are brown. */
:root {
  --orange: #ff6200;
  --brown: #551b00;
  --light: #fff7f2;
  --contour: #f6dfcf;
  --white: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 627px; overflow: hidden; background: var(--white); }
.ad { position: relative; width: 1200px; height: 627px; display: grid; grid-template-columns: 750px 450px; }
.left { display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 0 44px 0 60px; background: var(--orange); }
.lockup { display: inline-grid; gap: 6px; justify-self: start; }
.word { display: inline-flex; align-items: flex-start; gap: 3px; font: 700 36px/1 "Quicksand", "DM Sans", sans-serif; letter-spacing: -.02em; color: var(--white); }
.word svg { width: 17px; height: 17px; margin-top: 1px; fill: var(--brown); }
.word svg circle { fill: var(--white); }
.tag { font: 500 19px/1 "DM Sans", sans-serif; color: var(--brown); }
h1 { font: 300 80px/1.03 "DM Sans", sans-serif; letter-spacing: -.035em; color: var(--white); }
p { font: 500 27px/1.3 "DM Sans", sans-serif; color: var(--brown); max-width: 620px; }
.cta { align-self: flex-start; padding: 17px 30px; border-radius: 4px; background: var(--white); color: var(--brown); font: 500 22px/1 "IBM Plex Mono", monospace; letter-spacing: .04em; text-transform: uppercase; }
.right { position: relative; background: var(--light); overflow: hidden; }
.right svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.cover {
  position: absolute;
  left: 62px;
  top: 34px;
  width: 356px;
  height: auto;
  transform: perspective(1500px) rotateY(-12deg) rotateZ(4deg);
  box-shadow: -14px 22px 38px rgba(85, 27, 0, .3);
}
</style>
</head>
<body>
<div class="ad">
  <div class="left">
    <div class="lockup">
      <span class="word">getrecruiters<svg viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="7"/><circle cx="8" cy="8" r="3.2"/><circle cx="22" cy="8" r="3.2"/><circle cx="15" cy="15" r="3.2"/><circle cx="8" cy="22" r="3.2"/><circle cx="22" cy="22" r="3.2"/></svg></span>
      <span class="tag">Recruiters for Anything</span>
    </div>
    <h1>Know What Recruiters Expect to Be Paid</h1>
    <p>2026 Pay Asks and Work Setup from 154 Recruiters Who Applied with Us</p>
    <div class="cta">Get the Guide</div>
  </div>
  <div class="right">
    <svg viewBox="0 0 450 627" aria-hidden="true" fill="none" stroke="#f6dfcf" stroke-width="1.5">
      <ellipse cx="370" cy="110" rx="60" ry="42" transform="rotate(-18 370 110)"/>
      <ellipse cx="370" cy="110" rx="112" ry="80" transform="rotate(-18 370 110)"/>
      <ellipse cx="370" cy="110" rx="172" ry="124" transform="rotate(-18 370 110)"/>
      <ellipse cx="370" cy="110" rx="240" ry="176" transform="rotate(-18 370 110)"/>
      <ellipse cx="370" cy="110" rx="316" ry="236" transform="rotate(-18 370 110)"/>
      <ellipse cx="370" cy="110" rx="400" ry="304" transform="rotate(-18 370 110)"/>
      <ellipse cx="370" cy="110" rx="492" ry="380" transform="rotate(-18 370 110)"/>
      <ellipse cx="370" cy="110" rx="592" ry="464" transform="rotate(-18 370 110)"/>
    </svg>
    <img class="cover" src="../img/getrecruiters-recruiters-cover.png" alt="GetRecruiters Salary Guide 2026: Recruiters cover">
  </div>
</div>
</body>
</html>
